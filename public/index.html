<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>ERA · Hospital Appointments</title>
  <meta name="description" content="Book hospital appointments in seconds.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f766e'/><path d='M13 8h6v5h5v6h-5v5h-6v-5H8v-6h5z' fill='white'/></svg>">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('era.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="progress" aria-hidden="true"></div>
  <div id="app"><div class="boot"><span class="spinner"></span></div></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
